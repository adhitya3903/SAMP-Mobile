name: Cari kode voice

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        default: "GTA-2.10"

jobs:
  cari:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Cari voiceactive / voicepassive
        run: |
          echo "=== FILE YANG MENGANDUNG voiceactive/voicepassive ==="
          grep -rIl "voiceactive\|voicepassive" app/src || echo "tidak ada"
          for f in $(grep -rIl "voiceactive\|voicepassive" app/src); do
            echo
            echo "######## $f ########"
            wc -l "$f"
            grep -n -C 25 "voiceactive\|voicepassive" "$f" | head -150
          done

      - name: File yang namanya berkaitan mic/voice HUD
        run: |
          find app/src/main/cpp/samp -iname "*mic*" -o -iname "*voice*hud*" -o -iname "*speaker*" | head -30
