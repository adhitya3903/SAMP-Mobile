name: Cari kode voice

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        default: "GTA-2.10"

jobs:
  cari:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Kumpulkan bahan analisis tahap 2
        shell: bash
        run: |
          set +e
          mkdir -p hasil/file
          M=app/src/main

          g() { echo; echo "##### $1"; shift; grep -rIn "$@" $M 2>/dev/null | grep -v "/vendor/" | head -120; }
          {
            g "Penyimpanan launcher" -E "getSharedPreferences|SharedPreferences|getFilesDir|getExternalFilesDir|settings\.ini"
            g "Daftar server" -i -E "favourite|favorite|servers\.json|serverlist"
          } > hasil/pencarian2.txt

          cp_small() { for f in "$@"; do [ -f "$f" ] && [ "$(stat -c%s "$f")" -lt 122880 ] && cp --parents "$f" hasil/file/; done; }
          cp_small $(find $M/java/com/samp/mobile/launcher -type f -name "*.java")
          cp_small $(find $M/java/com/samp/mobile/game/ui -type f -iname "*dialog*")
          cp_small $(find $M/res/layout -type f \( -iname "dialog*" -o -iname "*acropolize*" -o -iname "*launcher*" \))
          cp_small $(find $M/res -type f \( -path "*drawable*" -o -path "*values*" \) \( -iname "*dialog*" -o -iname "colors.xml" -o -iname "styles.xml" -o -iname "themes.xml" -o -iname "*button*" -o -iname "*bg*" \))
          cp_small $M/AndroidManifest.xml app/build.gradle app/build.gradle.kts
          du -sh hasil

      - uses: actions/upload-artifact@v4
        with:
          name: hasil-analisis-2
          path: hasil/
