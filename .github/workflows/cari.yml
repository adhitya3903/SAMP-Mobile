name: Cari kode voice

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        default: "GTA-2.10"

jobs:
  cari:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Kumpulkan bahan analisis tahap 5
        shell: bash
        run: |
          set +e
          mkdir -p hasil/file
          S=app/src/main/cpp/samp

          g() { echo; echo "##### $1"; shift; grep -rIn "$@" app/src/main 2>/dev/null | grep -v "/vendor/" | head -80; }
          {
            g "TryLoadModel" -E "TryLoadModel"
            g "Last rendered object" -i -E "Last rendered|LastRendered|g_Last"
            g "Pratinjau model textdraw" -i -E "PreviewModel|ModelPreview|PREVIEW|byteModel"
            g "Render objek dan hook gambar" -i -E "Render_hook|RenderObject|CObject__Render"
          } > hasil/pencarian5.txt

          cp_big() { for f in "$@"; do [ -f "$f" ] && [ "$(stat -c%s "$f")" -lt 614400 ] && cp --parents "$f" hasil/file/; done; }

          cp_big $(grep -rIl "TryLoadModel" $S | grep -v /vendor/)
          cp_big $(find $S -type f \( -iname "textdraw*" -o -iname "streaming*" -o -iname "*preview*" \) -not -path "*/vendor/*")
          cp_big $S/game/hooks.cpp $S/game/game.cpp $S/game/vehicle.cpp
          du -sh hasil
          find hasil/file -type f | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: hasil-analisis-5
          path: hasil/
