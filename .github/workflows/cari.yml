name: Cari kode voice

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        default: "GTA-2.10"

jobs:
  cari:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Kumpulkan bahan loading screen
        shell: bash
        run: |
          set +e
          mkdir -p hasil/file
          M=app/src/main

          {
            echo "##### Referensi loading screen (Java, C++, XML)"
            grep -rIn -i "LoadingScreen\|loading_screen\|ShowLoading\|HideLoading\|LoadingProgress\|sendLoadingScreen" $M --include=*.java --include=*.cpp --include=*.h --include=*.xml --include=*.kt | grep -v /vendor/ | head -200
            echo
            echo "##### Resource yang berhubungan (loading, splash, logo, progress)"
            find $M/res -type f \( -iname "*loading*" -o -iname "*splash*" -o -iname "*logo*" -o -iname "*progress*" \)
            echo
            echo "##### Font yang tersedia"
            ls $M/res/font 2>/dev/null
          } > hasil/pencarian3.txt

          cp_small() { for f in "$@"; do [ -f "$f" ] && [ "$(stat -c%s "$f")" -lt 204800 ] && cp --parents "$f" hasil/file/; done; }

          cp_small $(grep -rIl -i "LoadingScreen\|ShowLoading\|HideLoading" $M --include=*.java --include=*.cpp --include=*.h --include=*.kt | grep -v /vendor/)
          cp_small $(find $M/res -type f \( -name "*.xml" \) \( -iname "*loading*" -o -iname "*splash*" -o -iname "*logo*" -o -iname "*progress*" \))
          cp_small $M/java/com/samp/mobile/game/SAMP.java $M/cpp/samp/java/jniutil.cpp $M/cpp/samp/java/jniutil.h
          du -sh hasil

      - uses: actions/upload-artifact@v4
        with:
          name: hasil-analisis-3
          path: hasil/
