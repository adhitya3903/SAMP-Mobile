name: Cari kode voice

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        default: "GTA-2.10"

jobs:
  cari:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Kumpulkan bahan analisis
        shell: bash
        run: |
          set +e
          export LC_ALL=C.UTF-8
          S=app/src/main/cpp/samp
          mkdir -p hasil/file

          find app/src/main -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.java" \) -not -path "*/vendor/*" | sort > hasil/00_daftar_file.txt
          cp patches/hud.patch hasil/01_hud.patch

          g() { echo; echo "##### $1"; shift; grep -rIn "$@" app/src/main 2>/dev/null | grep -v "/vendor/" | head -150; }
          {
            g "Teks Rusia" -P "[\x{0400}-\x{04FF}]" --include=*.cpp --include=*.h --include=*.java --include=*.xml
            g "Tombol >>" -F '">>"'
            g "Lampu dan parameter kendaraan" -i -E "VehicleParams|bLightsOn|LightsOn|SetLights|headlight"
            g "Custom model dan DL" -i -E "AddSimpleModel|CustomModel|DL-R1|0\.3\.DL|ModelDownload|Updating models|artwork"
            g "Versi dan net version" -E "0\.3\.7|4057|4062|NetVersion|iVersion|szVersion"
            g "Timeout dan koneksi" -i -E "ConnectionTimeout|SetTimeout|ConnectionLost|DisconnectionNotification"
          } > hasil/02_pencarian.txt

          cp_small() { for f in "$@"; do [ -f "$f" ] && [ "$(stat -c%s "$f")" -lt 122880 ] && cp --parents "$f" hasil/file/; done; }
          cp_small $(find $S -type f \( -iname "*dialog*" -o -iname "*uisettings*" -o -iname "*theme*" -o -iname "*style*" -o -iname "settings.*" -o -iname "*vehicle*" -o -iname "*rpc*" -o -iname "*netgame*" -o -name "main.cpp" \) -not -path "*/vendor/*" -not -path "*/voice_new/*")
          cp_small $(grep -rIlF '">>"' app/src/main | grep -v /vendor/)
          du -sh hasil

      - uses: actions/upload-artifact@v4
        with:
          name: hasil-analisis
          path: hasil/
