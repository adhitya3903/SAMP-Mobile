name: Build SAMP APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch client yang dibangun"
        default: "GTA-2.10"
      offsets:
        description: "Offset crash dari logcat (pisah spasi)"
        default: "0x149158 0x15bccc 0x14a2dc 0x1486a4"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Terima lisensi Android SDK (SDK sudah bawaan runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Buat keystore (proyek meminta file ../../keys/new.jks)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../keys"
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/../keys/new.jks" \
            -storepass 123123 -keypass 123123 -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Acropolize, O=Acropolize, C=ID"

      - name: Matikan cek signature bawaan (kunci kita beda dengan kunci pembuat asli)
        run: |
          F=app/src/main/java/com/samp/mobile/launcher/SplashActivity.java
          sed -i 's/if(!SignatureChecker.isSignatureValid(this, getPackageName()))/if(false)/' "$F"
          grep -n "if(false)" "$F"

      - name: Sertakan libbass.so ke APK (di-link lewat path, tidak ikut terkemas otomatis)
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            cp app/src/main/cpp/samp/vendor/bass/libs/$abi/libbass.so app/src/main/jniLibs/$abi/
          done
          ls -la app/src/main/jniLibs/*/

      - name: Perbaiki client native (alamat server tertanam)
        run: |
          # Client selalu connect ke 94.23.168.153:2305 (alamat tertanam). Pakai host/port dari settings.ini.
          M=app/src/main/cpp/samp/main.cpp
          sed -i 's|new CNetGame("94.23.168.153", 2305, |new CNetGame(pSettings->Get().szHost, pSettings->Get().iPort, |' "$M"
          grep -n "new CNetGame" "$M"
          grep -q 'pSettings->Get().szHost, pSettings->Get().iPort' "$M" || { echo "PATCH GAGAL: main.cpp"; exit 1; }

      - name: Terapkan patch HUD (tombol + FPS kecil, transparan, bisa diatur lewat settings.ini)
        run: |
          git apply --check patches/hud.patch
          git apply patches/hud.patch
          git diff --stat

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Terjemahkan offset crash ke nama fungsi
        continue-on-error: true
        run: |
          echo "=== Semua libsamp.so hasil build ==="
          find app/build -name libsamp.so -exec ls -la {} \;
          SO=$(find app/build -path "*obj/arm64-v8a/libsamp.so" | head -1)
          echo "Unstripped libsamp.so: $SO"
          ADDR2LINE=$(find "$ANDROID_HOME/ndk" -name llvm-addr2line | head -1)
          READELF=$(dirname "$ADDR2LINE")/llvm-readelf
          echo "=== BUILD ID (crash lama: f2d6c61f11df0b9a5cf15dbe15589deee3282492) ==="
          "$READELF" -n "$SO" | grep -i "build id"
          echo "=== HASIL ADDR2LINE ==="
          "$ADDR2LINE" -f -C -i -p -e "$SO" ${{ inputs.offsets }}

      - name: Daftar library native di dalam APK
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "\.so" || true

      - uses: actions/upload-artifact@v4
        with:
          name: samp-apk
          path: |
            app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: libsamp-symbols
          if-no-files-found: warn
          path: app/build/intermediates/cxx/**/obj/arm64-v8a/libsamp.so
