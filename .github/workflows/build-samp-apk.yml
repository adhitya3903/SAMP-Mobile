name: Build SAMP APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch client yang dibangun"
        default: "GTA-2.10"
      ekspor_keystore:
        description: "Isi 'ya' HANYA SEKALI untuk mengambil keystore. Biasanya biarkan 'tidak'"
        default: "tidak"
      abi:
        description: "Arsitektur untuk membaca crash: arm64-v8a (Redmi 9T) atau armeabi-v7a (Redmi 6A)"
        default: "arm64-v8a"
      offsets:
        description: "Offset crash dari logcat (pisah spasi)"
        default: "0x149158 0x15bccc 0x14a2dc 0x1486a4"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Terima lisensi Android SDK (SDK sudah bawaan runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Siapkan keystore (tetap dari Secrets, atau buat baru kalau belum ada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../keys"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/../keys/new.jks"
            echo ">>> Memakai keystore TETAP dari Secrets"
          else
            keytool -genkeypair -keystore "$GITHUB_WORKSPACE/../keys/new.jks" \
              -storepass 123123 -keypass 123123 -alias key0 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Acropolize, O=Acropolize, C=ID"
            echo ">>> PERINGATAN: Secret KEYSTORE_BASE64 belum ada, keystore BARU dibuat. APK ini tidak bisa menimpa versi lama."
          fi

      - name: Matikan cek signature bawaan (kunci kita beda dengan kunci pembuat asli)
        run: |
          F=app/src/main/java/com/samp/mobile/launcher/SplashActivity.java
          sed -i 's/if(!SignatureChecker.isSignatureValid(this, getPackageName()))/if(false)/' "$F"
          grep -n "if(false)" "$F"

      - name: Sertakan libbass.so ke APK (di-link lewat path, tidak ikut terkemas otomatis)
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            cp app/src/main/cpp/samp/vendor/bass/libs/$abi/libbass.so app/src/main/jniLibs/$abi/
          done
          ls -la app/src/main/jniLibs/*/

      - name: Perbaiki client native (alamat server tertanam)
        run: |
          # Client selalu connect ke 94.23.168.153:2305 (alamat tertanam). Pakai host/port dari settings.ini.
          M=app/src/main/cpp/samp/main.cpp
          sed -i 's|new CNetGame("94.23.168.153", 2305, |new CNetGame(pSettings->Get().szHost, pSettings->Get().iPort, |' "$M"
          grep -n "new CNetGame" "$M"
          grep -q 'pSettings->Get().szHost, pSettings->Get().iPort' "$M" || { echo "PATCH GAGAL: main.cpp"; exit 1; }

      - name: Terapkan patch HUD (tombol + FPS kecil, transparan, bisa diatur lewat settings.ini)
        run: |
          git apply --check patches/hud.patch
          git apply patches/hud.patch
          git diff --stat

      - name: Atur posisi dan ketebalan HUD (tombol di bawah radar, lebih tebal)
        run: |
          F=app/src/main/cpp/samp/settings.cpp
          sed -i 's/"ButtonPanelPosY", 38.0f/"ButtonPanelPosY", 160.0f/; s/"FPSPosY", 110.0f/"FPSPosY", 335.0f/; s/"HudAlpha", 0.35f/"HudAlpha", 0.75f/' "$F"
          grep -n "ButtonPanelPosY\|FPSPosY\|HudAlpha" "$F"
          grep -q '"ButtonPanelPosY", 160.0f' "$F" || { echo "PATCH GAGAL: HUD default"; exit 1; }

      - name: Fix crash tombol voice (texture voiceactive/voicepassive tidak ada)
        run: |
          python3 - <<'PY'
          p = 'app/src/main/cpp/samp/gui/samp_widgets/voicebutton.h'
          s = open(p, encoding='utf-8').read()
          old = 'renderer->drawImage(absolutePosition(), absolutePosition() + size(),'
          assert s.count(old) == 1, 'PATCH GAGAL: voicebutton.h'
          s = s.replace(old, 'if (!m_texture_micro_on || !m_texture_micro_off) return; // fix: texture voice tidak ada\n\t\t' + old)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n -B1 -A3 "fix: texture voice" app/src/main/cpp/samp/gui/samp_widgets/voicebutton.h

      - name: Fix lampu mobil menyala sendiri (status UNSET dibaca ON)
        run: |
          python3 - <<'PY'
          import re
          p = 'app/src/main/cpp/samp/game/vehicle.cpp'
          s = open(p, encoding='utf-8').read()
          pat = r'm_pVehicle->m_nVehicleFlags\.bLightsOn\s*=\s*iState\s*;'
          assert len(re.findall(pat, s)) == 1, 'PATCH GAGAL: vehicle.cpp'
          s = re.sub(pat, 'if (iState == 0 || iState == 1) m_pVehicle->m_nVehicleFlags.bLightsOn = iState; // fix: UNSET (-1/255) jangan dibaca ON', s)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "fix: UNSET" app/src/main/cpp/samp/game/vehicle.cpp

      - name: Fix mesin kendaraan menyala sendiri (mode manual, status UNSET = mati)
        run: |
          python3 - <<'PY'
          import re
          p = 'app/src/main/cpp/samp/net/vehiclepool.cpp'
          s = open(p, encoding='utf-8').read()
          pat = r'(if\s*\(\s*pNetGame->m_pNetSet->bManualVehicleEngineAndLight\s*\)\s*\{\s*)pVehicle->ApplyEngineState\(\s*pVehicle->GetEngineState\(\)\s*\)\s*;'
          assert len(re.findall(pat, s)) == 1, 'PATCH GAGAL: vehiclepool.cpp'
          s = re.sub(pat, r'\1pVehicle->ApplyEngineState(pVehicle->GetEngineState() == 1 ? 1 : 0); // fix: mode manual, UNSET = mati', s)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "fix: mode manual" app/src/main/cpp/samp/net/vehiclepool.cpp

      - name: Terjemahkan teks Rusia di dialog login
        run: |
          F=app/src/main/res/layout/dialog.xml
          test -f "$F" || { echo "PATCH GAGAL: dialog.xml tidak ada"; exit 1; }
          sed -i 's/Нажмите для ввода/Ketuk untuk mengisi/; s/Войти/Masuk/; s/Отмена/Batal/' "$F"
          grep -n 'hint=\|android:text=' "$F" | head -10

      - name: Tema dialog kuning-hitam (login dan semua dialog)
        run: |
          D=app/src/main/res/drawable
          cat > $D/acro_window_bg.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <corners android:radius="18dp"/>
                      <gradient android:type="linear" android:angle="45"
                          android:startColor="#F0121216"
                          android:centerColor="#F0191920"
                          android:endColor="#F03A3000"/>
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <corners android:radius="18dp"/>
                      <stroke android:width="1.5dp" android:color="#66FFD400"/>
                  </shape>
              </item>
          </layer-list>
          XML
          cat > $D/acro_input_bg.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="12dp"/>
              <solid android:color="#E60B0B0E"/>
              <stroke android:width="1dp" android:color="#40FFFFFF"/>
          </shape>
          XML
          cat > $D/acro_btn_primary.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="14dp"/>
              <gradient android:type="linear" android:angle="0"
                  android:startColor="#FFFFE14D"
                  android:endColor="#FFFFB800"/>
          </shape>
          XML
          cat > $D/acro_btn_secondary.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="14dp"/>
              <solid android:color="#1AFFD400"/>
              <stroke android:width="1.5dp" android:color="#FFFFD400"/>
          </shape>
          XML
          python3 - <<'PY'
          p = 'app/src/main/res/layout/dialog.xml'
          s = open(p, encoding='utf-8').read()
          for old, new in [
              ('@drawable/background_window_red', '@drawable/acro_window_bg'),
              ('@drawable/background_br_input', '@drawable/acro_input_bg'),
              ('"@drawable/button_br_red"', '"@drawable/acro_btn_primary"'),
              ('"@drawable/button_br_red_unfilled"', '"@drawable/acro_btn_secondary"'),
          ]:
              assert s.count(old) == 1, 'PATCH GAGAL: ' + old
              s = s.replace(old, new)
          def recolor(s, anchor, old, new):
              i = s.index(anchor)
              j = s.index(old, i)
              return s[:j] + new + s[j + len(old):]
          s = recolor(s, 'android:id="@+id/dialog_caption"', 'android:textColor="#ffffffff"', 'android:textColor="#ffffd400"')
          s = recolor(s, 'android:id="@+id/button_positive_text"', 'android:textColor="#ffffffff"', 'android:textColor="#ff111111"')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "acro_\|ffffd400\|ff111111" app/src/main/res/layout/dialog.xml

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-dists-8.9

      - name: Siapkan Gradle (server resmi dulu, lalu mirror cadangan)
        run: |
          chmod +x gradlew
          P=gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' "$P"
          ok=0
          for i in 1 2 3; do
            if ./gradlew --version --no-daemon; then ok=1; break; fi
            echo ">>> Server resmi gagal (percobaan $i), tunggu 30 detik..."
            sleep 30
          done
          if [ "$ok" != 1 ]; then
            for U in "https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip" "https://repo.huaweicloud.com/gradle/gradle-8.9-bin.zip"; do
              echo ">>> Mencoba mirror: $U"
              sed -i "s|^distributionUrl=.*|distributionUrl=${U}|" "$P"
              if ./gradlew --version --no-daemon; then ok=1; break; fi
            done
          fi
          [ "$ok" = 1 ] || { echo "Semua sumber Gradle gagal"; exit 1; }

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Terjemahkan offset crash ke nama fungsi
        continue-on-error: true
        run: |
          SO=$(find app/build -path "*obj/${{ inputs.abi }}/libsamp.so" | head -1)
          ADDR2LINE=$(find "$ANDROID_HOME/ndk" -name llvm-addr2line | head -1)
          READELF=$(dirname "$ADDR2LINE")/llvm-readelf
          echo "File simbol: $SO"
          "$READELF" -n "$SO" | grep -i "build id"
          "$ADDR2LINE" -f -C -i -p -e "$SO" ${{ inputs.offsets }}

      - name: Daftar library native di dalam APK
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "\.so" || true

      - uses: actions/upload-artifact@v4
        with:
          name: samp-apk
          path: |
            app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: libsamp-symbols
          if-no-files-found: warn
          path: app/build/intermediates/cxx/**/obj/*/libsamp.so

      - name: Salin keystore untuk diekspor (hanya kalau diminta)
        if: ${{ inputs.ekspor_keystore == 'ya' }}
        run: |
          mkdir -p export-keystore
          cp "$GITHUB_WORKSPACE/../keys/new.jks" export-keystore/new.jks

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.ekspor_keystore == 'ya' }}
        with:
          name: keystore-RAHASIA
          path: export-keystore/new.jks
          retention-days: 1
